<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>501 - Not Implemented</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --purple: #a855f7;
            --blue: #3b82f6;
            --pink: #ec4899;
            --bg: #030305;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background:
              radial-gradient(1200px 800px at 10% 10%, rgba(168,85,247,.15), transparent 40%),
              radial-gradient(1000px 700px at 90% 80%, rgba(59,130,246,.15), transparent 45%),
              var(--bg);
            color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .particle {
            position: fixed;
            width: 6px;
            height: 6px;
            background: linear-gradient(135deg, var(--purple), var(--blue));
            border-radius: 50%;
            opacity: .35;
            animation: float 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes float {
            from { transform: translateY(110vh) scale(.3); }
            to { transform: translateY(-10vh) scale(1); }
        }

        .glass {
            background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
            backdrop-filter: blur(22px);
            border: 1px solid rgba(255,255,255,.12);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 40px 90px rgba(0,0,0,.65);
        }

        .gradient-text {
            background: linear-gradient(120deg, #6366f1, #a855f7, #ec4899);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 8s linear infinite;
        }

        @keyframes shine {
            to { background-position: 300% center; }
        }

        .pulse-ring::before {
            content: "";
            position: absolute;
            inset: -20px;
            border-radius: 9999px;
            background: radial-gradient(circle, rgba(168,85,247,.2), transparent 70%);
            animation: pulse 4s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes pulse {
            0%, 100% { opacity: .3; transform: scale(.9); }
            50% { opacity: .6; transform: scale(1.1); }
        }

        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(168,85,247,0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<script>
    for(let i=0; i<40; i++){
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.animationDuration = 15 + Math.random() * 20 + 's';
        p.style.animationDelay = Math.random() * -20 + 's';
        document.body.appendChild(p);
    }
</script>

<div class="relative z-10 px-6 text-center">
    <div class="pulse-ring relative inline-block">
        <h1 class="text-[10rem] md:text-[14rem] font-black leading-none tracking-tighter opacity-10">	404</h1>
    </div>
    
    <div class="glass p-8 md:p-16 rounded-[3rem] -mt-20 md:-mt-32 max-w-2xl mx-auto">
        <h2 class="text-4xl md:text-6xl font-black mb-4 gradient-text">Not found</h2>
        <p class="text-slate-400 text-lg md:text-xl mb-10">
            Site taken down, or file deleted. :/
        </p>
        
        <div class="flex justify-center">
            <a href="index.html" class="px-10 py-4 bg-white text-black rounded-full font-black btn-glow transition-all">
                ← Go Back
            </a>
        </div>
    </div>
    
    <footer class="mt-20 opacity-30">
        <p class="text-xs font-mono uppercase tracking-widest">© 2026 Vantahub</p>
    </footer>
</div>
